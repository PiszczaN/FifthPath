# Installs the tools that every CI job needs, at the versions this repository
# uses. Run actions/checkout first: the action and the version files come from
# the checked-out repository.
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
name: Set up the toolchain
description: Installs Go, pnpm, Node.js, Task and the wails3 CLI, plus the Linux libraries Wails needs.

runs:
  using: composite
  # Actions are pinned to commit SHAs (a tag can be moved); the comment names
  # the release.
  steps:
    # On Linux, Wails reaches GTK 4 and WebKitGTK through cgo, so Go needs
    # their headers even to type-check the app.
    - name: Install Linux libraries for Wails
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    # Go version: the toolchain line in go.mod.
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    # pnpm version: packageManager in frontend/package.json.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: frontend/package.json

    # Node.js version: devEngines.runtime in frontend/package.json.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: frontend/package.json
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.50.0

    # The CLI version comes from go.mod, so it always matches the Wails module.
    - name: Install the wails3 CLI
      shell: bash
      run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

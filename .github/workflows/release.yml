# On every push to main, keeps a release pull request up to date; once that
# pull request is merged, tags the version, publishes a GitHub release and
# attaches the Windows, macOS and Linux builds to it.
# Docs: https://github.com/googleapis/release-please-action
name: Release
on:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

# One run at a time: a newer push waits instead of cancelling a run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Commit the version bump and the changelog, create tags and releases.
      contents: write
      # Open and update the release pull request.
      pull-requests: write
      # Create and apply the autorelease labels.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Reads release-please-config.json and .release-please-manifest.json
      # through the GitHub API, so no checkout is needed.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # The same builds as in CI, made from the tagged commit.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Upload files to the release.
      contents: write
    steps:
      # All three tarballs from this run, straight into dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fifthpath-*.tar.gz
          path: dist
          merge-multiple: true

      # The tag comes in through env, never pasted into the script.
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"

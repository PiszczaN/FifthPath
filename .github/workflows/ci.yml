# Lints, type-checks and tests every pull request and every push to main.
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Actions are pinned to commit SHAs (a tag can be moved)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go, pnpm, Node.js, Task, wails3 and the Linux libraries for Wails.
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain

      # Must match GOLANGCI_LINT_VERSION in Taskfile.yml; task lint:go checks it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Run all checks
        run: task check

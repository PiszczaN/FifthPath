# Lints, type-checks and tests every pull request and every push to main.
# Docs: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Actions are pinned to commit SHAs (a tag can be moved)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On Linux, Wails reaches GTK 4 and WebKitGTK through cgo, so Go needs
      # their headers even to type-check the app.
      - name: Install Linux libraries for Wails
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      # Go version: the toolchain line in go.mod
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # pnpm version: packageManager in frontend/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      # Node.js version: devEngines.runtime in frontend/package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.50.0

      # Must match GOLANGCI_LINT_VERSION in Taskfile.yml; task lint:go checks it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      # The CLI version comes from go.mod, so it always matches the Wails module.
      - name: Install the wails3 CLI
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: Run all checks
        run: task check
